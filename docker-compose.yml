services:
  api:
    build: ./apps/api
    environment:
      SLATE_DATABASE_URL: sqlite:///./data/slate.db
      SLATE_OFFLINE_MODE: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/data:/app/data
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api
