services:
  - type: web
    name: slate-market-research
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////tmp/slate.db
      - key: SLATE_FRONTEND_DIST_DIR
        value: /app/frontend
      - key: SLATE_OFFLINE_MODE
        value: "true"
      - key: SLATE_SEED_DEMO_DATA
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "10"
      - key: PROVIDER_MAX_RETRIES
        value: "2"
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
