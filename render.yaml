databases:
  - name: slate-market-research-db
    plan: free
    databaseName: slate
    user: slate

services:
  - type: web
    name: slate-market-research-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/apply_migrations.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: slate-market-research-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SLATE_OFFLINE_MODE
        value: "true"
      - key: SLATE_SEED_DEMO_DATA
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "10"
      - key: PROVIDER_MAX_RETRIES
        value: "2"
